<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Aung Khant Thaw (Nikola)</title>
<desc id="d">Software engineering, robotics and artificial intelligence. Second-year BSc Computer Science student at Queen's University Belfast.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05080F"/><stop offset="1" stop-color="#0B1426"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#22D3EE" stop-opacity="0.35"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.10"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#12304A" stroke-width="1" opacity="0.45"/>
  </pattern>
  <clipPath id="frame"><rect x="0" y="0" width="1200" height="380" rx="18"/></clipPath>
</defs>
<style>
  .sans { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, 'Courier New', monospace; }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
  .spin-rev { transform-box: fill-box; transform-origin: center; animation: spin 36s linear infinite reverse; }
  .pulse { animation: pulse 3.2s ease-in-out infinite; }
  .scan { animation: scan 6s linear infinite; }
  .in1 { animation: fadeup 0.9s ease-out 0.2s both; }
  .in2 { animation: fadeup 0.9s ease-out 0.6s both; }
  .in3 { animation: fadeup 0.9s ease-out 1.0s both; }
  .t1 { animation: type 1.2s steps(40) 1.4s both; }
  .t2 { animation: type 1.4s steps(48) 2.7s both; }
  .t3 { animation: type 1.4s steps(48) 4.2s both; }
  .grow { transform-box: fill-box; transform-origin: left; animation: grow 1.2s ease-out 0.5s both; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
  @keyframes scan { from { transform: translateY(-120px); } to { transform: translateY(400px); } }
  @keyframes fadeup { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#frame)">
  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="1200" height="120" fill="url(#scan)"/>

  <!-- HUD rings -->
  <g transform="translate(965 190)">
    <circle r="150" fill="url(#glow)" class="pulse"/>
    <g class="spin"><circle r="132" fill="none" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 10"/></g>
    <g class="spin-rev"><circle r="112" fill="none" stroke="#3B82F6" stroke-opacity="0.8" stroke-width="3" stroke-dasharray="120 40 30 40"/></g>
    <g class="spin"><circle r="90" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="2 6" stroke-opacity="0.7"/></g>
    <circle r="68" fill="#07101E" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.5"/>
    <g class="spin-rev"><path d="M0 -58 A58 58 0 0 1 50 29" fill="none" stroke="#22D3EE" stroke-width="4" stroke-linecap="round"/><path d="M0 58 A58 58 0 0 1 -50 -29" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/></g>
    <text class="mono pulse" y="-6" text-anchor="middle" font-size="15" fill="#E6F1FF" letter-spacing="3">NIKOLA</text>
    <text class="mono" y="16" text-anchor="middle" font-size="11" fill="#7DD3FC" letter-spacing="2">ONLINE</text>
    <line x1="-150" y1="0" x2="-138" y2="0" stroke="#22D3EE"/><line x1="138" y1="0" x2="150" y2="0" stroke="#22D3EE"/>
    <line x1="0" y1="-150" x2="0" y2="-138" stroke="#22D3EE"/><line x1="0" y1="138" x2="0" y2="150" stroke="#22D3EE"/>
  </g>

  <!-- text -->
  <text class="mono in1" x="64" y="78" font-size="15" fill="#22D3EE" letter-spacing="4">// PROFILE · NIKOLATW7</text>
  <text class="sans in2" x="62" y="146" font-size="62" font-weight="700" fill="#E6F1FF" letter-spacing="2">AUNG KHANT THAW</text>
  <rect class="grow" x="64" y="168" width="560" height="3" fill="url(#line)"/>
  <text class="sans in3" x="64" y="208" font-size="22" fill="#9FB7D9" letter-spacing="3">SOFTWARE ENGINEERING · ROBOTICS · AI</text>
  <g class="mono" font-size="17" fill="#C9D7EE">
    <text class="t1" x="64" y="262"><tspan fill="#22D3EE">&gt;</tspan> BSc Computer Science · Queen's University Belfast</text>
    <text class="t2" x="64" y="292"><tspan fill="#22D3EE">&gt;</tspan> Seeking a 2027 software engineering placement</text>
    <text class="t3" x="64" y="322"><tspan fill="#22D3EE">&gt;</tspan> Building software · learning robotics · exploring AI</text>
  </g>
  <text class="mono in3" x="64" y="352" font-size="17" fill="#22D3EE">&gt;</text>
  <rect class="blink" x="82" y="338" width="10" height="17" fill="#22D3EE"/>

  <!-- corner brackets -->
  <g fill="none" stroke="#22D3EE" stroke-width="2" stroke-opacity="0.8">
    <path d="M20 50V20H50"/><path d="M1150 20H1180V50"/><path d="M20 330V360H50"/><path d="M1150 360H1180V330"/>
  </g>
</g>
<rect x="0.5" y="0.5" width="1199" height="379" rx="18" fill="none" stroke="#1E3A5F"/>
</svg>
