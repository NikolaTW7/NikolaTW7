<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="VeloVerse: Full-stack bicycle education website. Status: LIVE" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#0B1426"/><stop offset="1" stop-color="#070B14"/></linearGradient>
  <linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
</defs>
<style>
  .sans { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, 'Courier New', monospace; }
  .sweep { animation: sweep 4s ease-in-out infinite; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes sweep { from { transform: translateX(-260px); } to { transform: translateX(1200px); } }
  @keyframes pulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="1" y="1" width="1198" height="118" rx="14" fill="url(#bg)" stroke="#1E3A5F"/>
<rect x="1" y="1" width="6" height="118" rx="3" fill="#22D3EE"/>
<text class="mono" x="40" y="50" font-size="18" fill="#22D3EE" letter-spacing="3">[01]</text>
<text class="sans" x="98" y="54" font-size="36" font-weight="700" fill="#E6F1FF" letter-spacing="1">VeloVerse</text>
<text class="sans" x="98" y="90" font-size="19" fill="#9FB7D9" letter-spacing="1">Full-stack bicycle education website</text>
<g transform="translate(1067 34)">
  <rect width="93" height="34" rx="17" fill="none" stroke="#22D3EE"/>
  <circle class="pulse" cx="18" cy="17" r="5" fill="#22D3EE"/>
  <text class="mono" x="32" y="22" font-size="14" fill="#22D3EE" letter-spacing="2">LIVE</text>
</g>
<rect class="sweep" x="0" y="116" width="260" height="2" fill="url(#ln)"/>
</svg>
