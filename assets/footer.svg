<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Build, learn, experiment, improve" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset="0.5" stop-color="#22D3EE"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></linearGradient></defs>
<style>
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, 'Courier New', monospace; }
